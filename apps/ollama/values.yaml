# Scaled to zero: not in use, frees 2 CPU / 6Gi requests for the Minecraft server.
# Set back to 1 to re-enable.
replicaCount: 0

ollama:
  models:
    pull:
      - "llama3.2:3b"

persistentVolume:
  enabled: true
  storageClass: "local-path"
  size: 30Gi

resources:
  requests:
    cpu: "2"
    memory: "6Gi"
  limits:
    cpu: "3"
    memory: "16Gi"
